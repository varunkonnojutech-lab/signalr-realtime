services:
  redis:
    image: redis:7-alpine
    container_name: signalr-realtime-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalr-realtime-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SignalR__RedisConnectionString: "redis:6379,abortConnect=false"
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy
